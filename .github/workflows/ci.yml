name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Retargeting a PR fires `edited`, which is not in the default activity
    # types (opened/synchronize/reopened). Without it, a retargeted PR would
    # not re-run CI against its new base (M7 gotcha, PR #35).
    types: [opened, synchronize, reopened, edited]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install systemd headers
        # sdjournal (go-systemd) is cgo: it compiles against
        # systemd/sd-journal.h. Runtime resolves libsystemd via dlopen,
        # which any systemd host provides; only the headers are a
        # build-time dependency.
        run: sudo apt-get update && sudo apt-get install -y libsystemd-dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install systemd headers
        # golangci-lint typechecks the cgo sdjournal package too.
        run: sudo apt-get update && sudo apt-get install -y libsystemd-dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
